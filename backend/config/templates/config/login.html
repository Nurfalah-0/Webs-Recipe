<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to SeGizi">
  <link rel="icon" href="/favicon.ico">
  <title>Sign in | SeGizi</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20302a; background: #f4f8f5; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(26rem, calc(100% - 2rem)); padding: 2rem; border-radius: 1rem; background: white; box-shadow: 0 1rem 3rem #183b2814; }
    h1 { margin-top: 0; color: #198754; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #aebdb4; border-radius: .4rem; font: inherit; }
    button { margin-top: 1.25rem; border: 0; color: white; background: #198754; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { overflow-wrap: anywhere; }
    .error { color: #b02a37; }
    .success { color: #146c43; }
    a { color: #146c43; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in to SeGizi</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Sign in</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="/">Back to API home</a></p>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.className = "";
      message.textContent = "Signing in…";

      try {
        const response = await fetch("/api/auth/login/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.elements.username.value,
            password: form.elements.password.value
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Sign-in failed. Check your credentials.");
        }
        message.className = "success";
        message.textContent = `Signed in as ${data.user.username}. API token: ${data.token}`;
      } catch (error) {
        message.className = "error";
        message.textContent = error.message || "Unable to reach the sign-in service.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
